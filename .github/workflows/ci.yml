name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Mirage checks
        run: |
          python scripts/verify_kpis.py
          python scripts/verify_allocation.py
      - name: Lint
        run: ruff check agent evals tests scripts/record_audit.py scripts/publish_eval.py
      - name: Test
        run: pytest -q tests
      - name: Audit eval (rescore the recorded run)
        run: python evals/run_evals.py --model ci --from-file "$(ls evals/results/*.json | sort | tail -1)" --no-write
